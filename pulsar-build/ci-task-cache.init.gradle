import org.gradle.api.tasks.testing.Test

// Explicitly selected CI jobs exchange this directory as a same-run artifact.
// An absent variable leaves the ordinary Gradle cache configuration unchanged.
def taskCachePath = System.getenv('PULSAR_CI_TASK_CACHE')
if (taskCachePath) {
    def taskCacheDirectory = new File(taskCachePath)
    if (!taskCacheDirectory.isAbsolute()) {
        throw new GradleException('PULSAR_CI_TASK_CACHE must be an absolute path')
    }

    // Init scripts also run for included builds, including build-logic.
    settingsEvaluated { settings ->
        settings.buildCache { cache ->
            cache.local {
                directory = taskCacheDirectory
                enabled = true
            }
            if (cache.remote != null) {
                cache.remote.enabled = false
            }
        }
    }

    allprojects { project ->
        project.tasks.withType(Test).configureEach {
            outputs.doNotCacheIf('CI shares build preparation, never test results') { true }
        }
    }
}
